name: Actualizar RSS de Oryzon

on:
  workflow_dispatch:

  schedule:
    # Se lanza entre las 05:23 y las 18:23 UTC.
    # El programa comprueba la hora real de España y solo
    # trabaja de lunes a viernes entre las 07:00 y las 19:59.
    - cron: "23 5-18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-oryzon
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear RSS
        run: python actualizar_rss.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en el RSS."
          else
            git commit -m "Actualizar RSS de Oryzon"
            git push
          fi
